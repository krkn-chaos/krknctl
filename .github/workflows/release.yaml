name: Create Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: test release note generation
        run: bash .github/scripts/generate-release-notes_test.sh
      - name: generate release notes from commits
        run: |
          VERSION="$GITHUB_REF_NAME" \
            OUTPUT=release-notes.md \
            TEMPLATE=.github/release-template.md \
            bash .github/scripts/generate-release-notes.sh
          cat release-notes.md
      - name: create release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file release-notes.md

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          syft . --scope all-layers --output cyclonedx-json > sbom.json
          echo "SBOM generated successfully!"
          gh release upload ${{ github.ref_name }} sbom.json
