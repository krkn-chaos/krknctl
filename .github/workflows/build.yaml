# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: krknctl build
on:
  release:
    types: [published]
jobs:
  build-linux-amd64:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: set up go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.26.2'
        cache: false

    - name: advance version
      run: |
        tmp_config=$(mktemp)
        jq --arg version "$RELEASE_TAG" '.version = $version' pkg/config/config.json > "$tmp_config"
        mv "$tmp_config" pkg/config/config.json

    - name: build linux amd64
      env:
        GOOS: "linux"
        GOARCH: "amd64"
        CGO_ENABLED: 0
        BINARY: "linux-amd64"
      run: |
        go build -mod=vendor -tags "containers_image_openpgp exclude_graphdriver_btrfs" -ldflags="-w -s" -o $BINARY/ ./...
        tar cfvz "krknctl-${RELEASE_TAG}-${BINARY}.tar.gz" -C "$BINARY" krknctl

    - name: upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: linux-amd64
        path: krknctl-${{github.event.release.tag_name}}-linux-amd64.tar.gz

  build-linux-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: set up go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.26.2'
        cache: false

    - name: advance version
      run: |
        tmp_config=$(mktemp)
        jq --arg version "$RELEASE_TAG" '.version = $version' pkg/config/config.json > "$tmp_config"
        mv "$tmp_config" pkg/config/config.json

    - name: build linux arm64
      env:
        GOOS: "linux"
        GOARCH: "arm64"
        CGO_ENABLED: 0
        BINARY: "linux-arm64"
      run: |
        go build -mod=vendor -tags "containers_image_openpgp exclude_graphdriver_btrfs" -ldflags="-w -s" -o $BINARY/ ./...
        tar cfvz "krknctl-${RELEASE_TAG}-${BINARY}.tar.gz" -C "$BINARY" krknctl

    - name: upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: linux-arm64
        path: krknctl-${{github.event.release.tag_name}}-linux-arm64.tar.gz

  build-darwin:
    name: Build darwin (both architectures)
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: advance version
      run: |
        tmp_config=$(mktemp)
        jq --arg version "$RELEASE_TAG" '.version = $version' pkg/config/config.json > "$tmp_config"
        mv "$tmp_config" pkg/config/config.json

    - name: Build darwin binaries with xgo
      uses: crazy-max/ghaction-xgo@acf46aa99b919eb9ef6bba89dfd13bafa680667f # v3
      with:
        xgo_version: latest
        go_version: '1.26.2'
        dest: build
        prefix: krknctl
        targets: darwin/arm64,darwin/amd64
        v: true
        x: false
        race: false
        ldflags: -w -s
        buildmode: default
        buildvcs: auto
        trimpath: true
        pkg: .
        tags: containers_image_openpgp
        buildx: -mod=vendor

    - name: Package darwin arm64
      run: |
        mkdir -p darwin-apple-silicon
        mv build/krknctl-darwin-arm64 darwin-apple-silicon/krknctl
        tar cfvz "krknctl-${RELEASE_TAG}-darwin-apple-silicon.tar.gz" -C darwin-apple-silicon krknctl

    - name: Package darwin amd64
      run: |
        mkdir -p darwin-intel
        mv build/krknctl-darwin-amd64 darwin-intel/krknctl
        tar cfvz "krknctl-${RELEASE_TAG}-darwin-intel.tar.gz" -C darwin-intel krknctl

    - name: upload darwin arm64
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: darwin-apple-silicon
        path: krknctl-${{github.event.release.tag_name}}-darwin-apple-silicon.tar.gz

    - name: upload darwin amd64
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: darwin-intel
        path: krknctl-${{github.event.release.tag_name}}-darwin-intel.tar.gz

  # Builds a separate linux/amd64 binary inside a CentOS Stream 9 container.
  # With CGO_ENABLED=0 the binary is statically linked (no GLIBC dependency),
  # but this target is kept for consumers who expect a CentOS-specific artifact.
  build-linux-amd64-centos9:
    name: Build linux/amd64 (CentOS Stream 9)
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    container:
      image: quay.io/centos/centos:stream9
    permissions:
      contents: read
    steps:
    - name: install build dependencies
      run: dnf install -y git tar jq

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: install go
      run: |
        curl -fsSL https://go.dev/dl/go1.26.2.linux-amd64.tar.gz | tar -C /usr/local -xz
        echo "/usr/local/go/bin" >> "$GITHUB_PATH"

    - name: advance version
      run: |
        tmp_config=$(mktemp)
        jq --arg version "$RELEASE_TAG" '.version = $version' pkg/config/config.json > "$tmp_config"
        mv "$tmp_config" pkg/config/config.json

    - name: build linux amd64 centos9
      env:
        GOOS: linux
        GOARCH: amd64
        CGO_ENABLED: 0
        BINARY: linux-amd64-centos9
      run: |
        go build -buildvcs=false -mod=vendor -tags "containers_image_openpgp exclude_graphdriver_btrfs" -ldflags="-w -s" -o $BINARY/ ./...
        tar cfvz "krknctl-${RELEASE_TAG}-${BINARY}.tar.gz" -C "$BINARY" krknctl

    - name: upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: linux-amd64-centos9
        path: krknctl-${{github.event.release.tag_name}}-linux-amd64-centos9.tar.gz

  upload-releases:
    name: Upload release artifacts
    needs: [build-linux-amd64, build-linux-arm64, build-darwin, build-linux-amd64-centos9]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        path: artifacts

    - name: Upload to release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd artifacts
        for dir in */; do
          for file in "$dir"*.tar.gz; do
            gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"
          done
        done

    - name: Generate and upload checksums
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd artifacts
        sha256sum */*.tar.gz > checksums.txt
        gh release upload "$RELEASE_TAG" checksums.txt --clobber --repo "$GITHUB_REPOSITORY"
